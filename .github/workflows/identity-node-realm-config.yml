# @varyx-io/realm-config (identity/node/realm-config; identity/docs ADR 0024).
#
# check:   every pull request and push to main that touches the package:
#          typecheck, test, build, and an allowlist of the packed files.
# publish: a tag identity/node/realm-config/v<version> on a commit already on
#          main publishes that version to npm, through npm trusted publishing
#          (OIDC; no stored token), with provenance.
name: "@varyx-io/realm-config"

on:
  # Run by hand: path filters skip a workflow when its paths didn't change.
  workflow_dispatch:
  pull_request:
    paths:
      - "identity/node/realm-config/**"
      - ".github/workflows/identity-node-realm-config.yml"
  push:
    branches: [main]
    # Path filters don't apply to tag pushes.
    tags: ["identity/node/realm-config/v*"]
    paths:
      - "identity/node/realm-config/**"
      - ".github/workflows/identity-node-realm-config.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: identity/node/realm-config

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: identity/node/realm-config/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The package contains only its build and source
        run: npm pack --dry-run --json | node -e 'const f=JSON.parse(require("fs").readFileSync(0))[0].files.map(x=>x.path); const bad=f.filter(p=>!/^(dist\/|src\/|package\.json$|README\.md$)/.test(p)); if(bad.length){console.error("unexpected files:",bad);process.exit(1)} console.log(f.join("\n"))'

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/identity/node/realm-config/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing and provenance: this job only.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (11.5.1 or later)
        run: npm install -g npm@11.21.0
      - name: The tag names package.json's version, on a commit already on main
        run: |
          tag_version="${GITHUB_REF_NAME#identity/node/realm-config/v}"
          package_version="$(node -p 'require("./package.json").version')"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match package.json version $package_version"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA isn't on main: tag a reviewed commit"; exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          # Only for the package's first publish, before npm can trust this
          # workflow (npm trusted publishers can't be set on an unpublished
          # package). Unset afterwards: npm then authenticates by OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
